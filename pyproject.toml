[build-system]
requires = ["setuptools>=66"]
build-backend = "setuptools.build_meta"

[project]
name = "carpi"
version = "0.1.0"
description = "Research probe for Raspberry Pi as a CarPlay phone source"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.scripts]
carpi = "carpi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
